name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Si el repositorio ya incluye package-lock.json, se puede cambiar por `npm ci`.
      - run: npm install
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Pruebas (sistema experto y simulación)
        run: npm test
      - name: Compilar
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
