<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SIARF: sistema inteligente de atención rápida y simulación de flujo paciente-médico." />
    <meta name="theme-color" content="#0e7c6b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema antes de pintar para evitar el destello de color.
      (function () {
        try {
          var tema = localStorage.getItem('siarf_tema');
          if (tema !== 'claro' && tema !== 'oscuro') {
            tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          document.documentElement.dataset.tema = tema;
        } catch (e) {
          document.documentElement.dataset.tema = 'claro';
        }
      })();
    </script>
    <title>SIARF · Atención rápida y flujo paciente-médico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
